name: Deploy to production

# Every push to main redeploys swenlly.com. Merging a PR is therefore a release.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys race each other onto the same box.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in SSH_KEY SSH_HOST SSH_USER; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Secret $v is not set. See DEPLOY.md section 8."
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS not set — trusting the host key on first sight."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" \
              'set -euo pipefail; cd ~/swenlly && ./scripts/deploy.sh'
