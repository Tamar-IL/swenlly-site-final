# Live config. Copied into nginx/active/default.conf by scripts/init-letsencrypt.sh.

# ── HTTP: ACME challenge + redirect everything else to HTTPS ──
server {
    listen 80;
    server_name swenlly.com www.swenlly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://swenlly.com$request_uri;
    }
}

# ── www → apex ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.swenlly.com;

    ssl_certificate     /etc/letsencrypt/live/swenlly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swenlly.com/privkey.pem;

    return 301 https://swenlly.com$request_uri;
}

# ── the site ──
server {
    listen 443 ssl;
    http2 on;
    server_name swenlly.com;

    ssl_certificate     /etc/letsencrypt/live/swenlly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swenlly.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # The 56MB portfolio video — allow range requests, don't buffer it through nginx.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/otf;
    gzip_min_length 1024;

    # Next build output is content-hashed — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # the /api/agent LLM call can be slow
    }
}
